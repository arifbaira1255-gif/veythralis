name: Release APK

# Publishes the built APK as a GitHub Release asset, so the download link does not expire
# the way an Actions artifact does (artifacts are deleted after 30 days; release assets are
# kept for the life of the release).
#
# Runs after the build workflow succeeds, and can also be triggered by hand.

on:
  workflow_run:
    workflows: ["Build Android APK"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v3.0.0)
        required: true
        default: v3.0.0

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the source run
        id: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/android.yml/runs?per_page=1&status=success" --jq '.workflow_runs[0].id')
          else
            RUN_ID="${{ github.event.workflow_run.id }}"
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using run $RUN_ID"

      - name: Download the APK artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh run download "${{ steps.src.outputs.run_id }}" -n zuno-apk -D dist
          ls -lh dist/
          sha256sum dist/zuno.apk | tee dist/SHA256.txt

      - name: Read the version from app.json
        id: ver
        run: |
          V=$(node -e "console.log(require('./app.json').expo.version)")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "app version $V"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # A manual dispatch uses the tag the user typed; an automatic run uses v<version>.
          if [ -z "$TAG" ]; then TAG="v$VERSION"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

          NOTES=$(cat <<EOF
          ## Zuno Browser $TAG

          A privacy-hardened Android browser. Package \`com.zuno.browser\`.

          ### Install
          1. Download \`zuno.apk\` below.
          2. Open it on the phone and allow "install unknown apps" for your browser or file manager.
          3. Install and open.

          This build is signed with the CI debug keystore, so it installs directly but is not
          suitable for Play Store submission.

          ### Verify the download
          \`\`\`
          $(cat dist/SHA256.txt)
          \`\`\`

          ### What is in this build
          - Cookie / Storage / IndexedDB / Cache Storage purge, verified against a real browser
          - Fingerprint rotation with a coherent Chrome identity (UA, Client Hints, plugins)
          - Auto-refresh that mints a new identity on every cycle
          - Do Not Track, referrer stripping, window.name clearing, history.length coarsening
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/zuno.apk dist/SHA256.txt --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" dist/zuno.apk dist/SHA256.txt --title "Zuno Browser $TAG" --notes "$NOTES"
          fi

      - name: Report the download URL
        run: |
          echo "### Download" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/download/${TAG}/zuno.apk" >> "$GITHUB_STEP_SUMMARY"
