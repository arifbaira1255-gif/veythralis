name: Build Android APK

# This workflow builds the APK with Gradle directly, on GitHub's own runner.
# It needs NO Expo account and NO token: the runner already has the Android SDK and
# Java, so `expo prebuild` generates the native project and Gradle compiles it.
#
# Expo's generated android/app/build.gradle signs the release build with the debug
# keystore, so the resulting APK is signed and installs on any phone.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The app icon is generated from source (tools/make_icon.py) rather than committed
      # as a binary, so it is always reproducible and never drifts from the brand colours.
      - name: Generate app icon
        run: |
          pip install --quiet pillow numpy
          python3 tools/make_icon.py
          ls -lh assets/images/

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Verify JS bundle compiles
        run: npx expo export --platform android --output-dir .expo-export-check

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect the APK
        run: |
          mkdir -p artifacts
          find android -name '*.apk' -type f
          cp "$(find android -name '*.apk' -type f | head -1)" artifacts/zuno.apk
          ls -lh artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: zuno-apk
          path: artifacts/zuno.apk
          retention-days: 30
