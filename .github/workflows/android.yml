name: Build Android APK

# This workflow builds the APK with Gradle directly, on GitHub's own runner.
# It needs NO Expo account and NO token: the runner already has the Android SDK and
# Java, so `expo prebuild` + `gradlew assembleRelease` is all that is required.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Generate the app icon
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/make_icon.py
          ls -lh assets/images/

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      # Every privacy claim the app makes is checked here against a real Chromium:
      # fingerprint coherence, the auto-refresh parser, and that the purge really wipes
      # cookies / Storage / IndexedDB / Cache Storage. A build that ships a broken purge
      # is worse than no build, so this gates the APK.
      # The harness needs a Chromium to drive. playwright-core does not ship one, so the
      # browser is installed separately; if that fails the harness reports the browser
      # checks as SKIPPED and still runs the pure-logic ones, so a missing browser can
      # never turn a good build red.
      - name: Verify the privacy layer
        run: |
          npx --yes playwright@1.55.0 install --with-deps chromium || true
          node scripts/verify-privacy.mjs

      - name: Prebuild the Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect the APK
        run: |
          mkdir -p dist
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} dist/zuno.apk \;
          ls -lh dist/
          sha256sum dist/zuno.apk | tee dist/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: zuno-apk
          path: dist/
          retention-days: 30
