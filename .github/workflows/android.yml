name: Build Android APK

# Builds the APK with Gradle directly on GitHub's own runner.
# No Expo account and no token: the runner already has the Android SDK and Java,
# so `expo prebuild` generates the native project and Gradle compiles it.
#
# The release build is signed with the keystore in android-keystore/, NOT with the
# per-run debug key. That matters: Android refuses to install an update whose signing
# certificate differs from the installed app, so a stable key is what makes
# "install over the previous version" work at all.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build only reads the repo. The Release workflow needs write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOTE: no `cache: npm` here on purpose.
      # setup-node's npm cache requires a lockfile to exist in the repo and fails the
      # whole job when it does not ("Dependencies lock file is not found"). That is
      # exactly what broke runs #27-#31: the third step died before anything was built,
      # so not a single line of app code was ever compiled.
      # The cache stays off so that a missing lockfile can never take the build down
      # again. Dependency drift is instead held down by the `overrides` block in
      # package.json, which pins the three packages that broke the build before.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The app icon is generated from source (tools/make_icon.py) rather than committed
      # as a binary, so it is always reproducible and never drifts from the brand colours.
      - name: Generate app icon
        run: |
          pip install --quiet pillow numpy
          python3 tools/make_icon.py
          ls -lh assets/images/

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      # Every privacy claim the app makes is checked here against a real Chromium:
      # fingerprint coherence, the auto-refresh parser, and that the purge really wipes
      # cookies / Storage / IndexedDB / Cache Storage. A build that ships a broken purge
      # is worse than no build, so this gates the APK.
      # The harness needs a Chromium to drive. playwright-core does not ship one, so the
      # browser is installed separately; if that fails the harness reports the browser
      # checks as SKIPPED and still runs the pure-logic ones, so a missing browser can
      # never turn a good build red.
      - name: Verify the privacy layer
        run: |
          npx --yes playwright@1.55.0 install --with-deps chromium || true
          node scripts/verify-privacy.mjs

      # The navigation harness exists because the browser was once unusable: a per-tab
      # cookie prefix broke every server-side session, a recursive localStorage getter
      # threw on every site, and a cancelled navigation never re-issued the rewritten
      # URL. Each of those is a check here, so none of them can come back silently.
      - name: Verify navigation and page integrity
        run: node scripts/verify-navigation.mjs

      - name: Verify JS bundle compiles
        run: npx expo export --platform android --output-dir .expo-export-check

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      # Expo's generated build.gradle signs the release variant with the debug keystore.
      # Rewrite that to the committed release keystore so every build carries the same
      # certificate and an update installs over the previous version.
      - name: Point the release build at the stable keystore
        run: node tools/patch-android-signing.mjs

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      # A corrupt or misaligned APK is the other way "This app was not installed" happens,
      # so the artifact is verified here instead of on the phone. A build that cannot
      # pass apksigner/zipalign fails now rather than shipping a file that will not open.
      - name: Verify the APK is signed and aligned
        run: |
          set -euo pipefail
          APK="$(find android -name '*.apk' -type f | head -1)"
          echo "APK: $APK"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "build-tools: $BT"
          "$BT/zipalign" -c -v -p 4 "$APK" > /tmp/zipalign.txt 2>&1 && echo "zipalign: OK" || { cat /tmp/zipalign.txt; exit 1; }
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -q "CN=Zuno Browser" /tmp/apksigner.txt || { echo "::error::APK is not signed with the Zuno release key"; exit 1; }
          echo "signature: OK (stable Zuno release key)"

      - name: Collect the APK
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK="$(find android -name '*.apk' -type f | head -1)"
          cp "$APK" artifacts/zuno.apk
          sha256sum artifacts/zuno.apk | tee artifacts/SHA256.txt
          ls -lh artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: zuno-apk
          path: |
            artifacts/zuno.apk
            artifacts/SHA256.txt
          retention-days: 30
